<style id="responsive-fix">
  /* Responsive viewport foundation */
  html, body { width:100%; min-width:0; min-height:100%; overflow:hidden; }

    width:100vw;
    height:100svh;
    min-height:320px;

    font-size:clamp(9px, 0.78vw, 14px);

  .hs-root { min-height:0; }
  .hs-main, .hs-left, .hs-side, .hs-panel, .hs-terminal-wrap { min-width:0; min-height:0; }
  .hs-terminal, .hs-kv, .hs-ops-body { min-width:0; }

  .hs-stat-target { min-width:0; flex:1 1 12em; }
  .hs-stat-target b { min-width:0; display:block; overflow:hidden; text-overflow:ellipsis; }
  .hs-side { min-width:0; }

  /* Never let the preview become a tiny strip outside fullscreen. */
  .hackerSimulatorScreen:not(:fullscreen) {
    height:100svh;
    min-height:320px;
    font-size:clamp(9px, 0.78vw, 14px);
  }

  @media (max-width:720px) {
    .hackerSimulatorScreen, .hackerSimulatorScreen:not(:fullscreen) {
      height:100svh;
      min-height:360px;
      padding:6px;
      font-size:clamp(9px, 2.35vw, 12px);

    .hackerSimulatorScreen .hs-main,
    .hackerSimulatorScreen:fullscreen .hs-main {
      grid-template-columns:1fr;
      grid-template-rows:minmax(0, 1fr) minmax(180px, 1.15fr);

    .hackerSimulatorScreen .hs-side,
    .hackerSimulatorScreen:fullscreen .hs-side {
      grid-template-columns:1fr 1fr;
      grid-template-rows:minmax(100px, 1fr) minmax(80px, .8fr) max-content;
    }
    .hackerSimulatorScreen .hs-netmap,
    .hackerSimulatorScreen .hs-ops,
    .hackerSimulatorScreen .hs-tele { grid-column:1/-1; }
    .hackerSimulatorScreen .hs-local { min-height:0; }
    .hackerSimulatorScreen .hs-topbar { gap:.35em .8em; }
    .hackerSimulatorScreen .hs-stat i { display:none; }
    .hackerSimulatorScreen .hs-terminal { overflow:hidden; }
    .hackerSimulatorScreen #hs-terminal .hs-line,
    .hackerSimulatorScreen #hs-packets .hs-line {

    .hackerSimulatorScreen:fullscreen .hs-side {
